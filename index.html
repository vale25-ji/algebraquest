 return'Comprueba tu resultado con la operación inversa y pregúntate si tiene sentido (un descuento baja el precio, un aumento lo sube).'}
function tutor(e,I){const t=e.t,p=sp(e.proc);let h=`<b>🤖 Tutor</b><p>${TP[t].tip}</p>`;
 if(S.style==='visual'){h+='<p class="m">Mira el camino paso a paso:</p>'+steps(p.concat('Respuesta: '+e.ans));if(t==='in')h+=nl(e.A.v,e.A.o)}
 else if(S.style==='ejemplos'){const x=pickEx(t,e.i);h+=`<p class="m">Ejemplo resuelto parecido:</p><div class="eq sm">${esc(x.q)}</div>`+steps(sp(x.proc).concat('Respuesta: '+x.ans))}
 else if(S.style==='ensayo')h+=`<p>${ens(e,I)}</p>`;
 else{const s=p.length>1?p.slice(0,-1):p;h+='<p class="m">Copia estos pasos en tu cuaderno y completa el último:</p>'+steps(s)+`<div class="step"><span>${s.length+1}</span><div>¿Cuál es la respuesta final?</div></div>`}
 return h+'<p><b>⚡ Micro reto:</b> resuelve este otro ejercicio para seguir avanzando.</p>'}
function submit(){const e=S.scr==='place'?T.pp[T.pi]:T.cur,I={v:g('v'),w:g('w'),o:g('o')};
 if(!I.v.trim()||(e.t!=='ex'&&!isFinite(pn(I.v)))||(e.t==='si'&&!isFinite(pn(I.w)))){T.msg='Escribe tu respuesta (puedes usar fracciones como 3/2).';return render()}
 T.msg='';const ok=chk(e,I);
 if(S.scr==='place'){if(ok)T.ps++;T.pi++;if(T.pi>=3){const l=T.ps>=3?3:T.ps===2?2:1;S.t[T.tid]={lvl:l,unl:l,per:{1:0,2:0,3:0},seen:T.pp.map(x=>x.i)};if(Object.keys(S.t).length>=3)badge('cl');S.scr='ready';save()}return render()}
 const P=S.t[e.t];
 if(ok){let m='¡Correcto! 🎉';
  if(T.mode==='micro'){S.xp+=5;badge('tut');m='¡Micro reto superado! +5 XP. Ya puedes continuar.'}
  else{S.ok++;S.streak++;const x=10+Math.min(S.streak,5);S.xp+=x;P.per[P.lvl]++;P.seen.push(e.i);m+=` +${x} XP`;badge('first');if(S.streak>=3)badge('r3');if(S.ok>=10)badge('t10');
   if(P.per[P.lvl]>=4&&P.unl===P.lvl&&P.lvl<3){P.unl++;m+=` 🔓 ¡Desbloqueaste el nivel ${LV[P.unl]}!`}}
  T.fb={ok:1,m};T.done=true}
 else{S.bad++;S.streak=0;S.err[e.t]=(S.err[e.t]||0)+1;T.fb={ok:0,h:tutor(e,I)};T.mode='micro';T.cur=pickEx(e.t,e.i)}
 save();render()}
const next=()=>{T.mode='main';T.cur=pickEx(T.tid);T.fb=null;T.done=false;render()},
setLvl=l=>{S.t[T.tid].lvl=l;save();next()},
go=s=>{S.scr=s;save();render()},
reset=()=>{S=fresh();try{localStorage.removeItem('aq2')}catch(e){}T={msg:'',fb:null,done:false,mode:'main',cur:null,tid:null};render()};
function pickT(t){T.tid=S.topic=t;T.msg='';if(S.t[t]){S.scr='play';next()}else{S.scr='place';T.pi=0;T.ps=0;T.pp=[1,2,3].map(l=>mk(t,rr(...rg(l))));render()}}
function ans(i){const s=Q[T.qi].o[i][1];T.qs[s]=(T.qs[s]||0)+1;T.qi++;if(T.qi>=3){S.style=Object.entries(T.qs).sort((a,b)=>b[1]-a[1])[0][0];S.scr='home';save()}render()}
function pc(e){const t=e.t,inp=(id,ph)=>`<input id="${id}" inputmode="text" autocomplete="off" placeholder="${ph}">`;
 return`<div class="m">${TP[t].e} ${TP[t].n}</div><div class="eq ${e.q.length>22?'sm':''}">${esc(e.q)}</div><div class="row">`+
 (t==='ec'?'<b>x =</b>'+inp('v','valor'):t==='in'?'<b>x</b><select id="o"><option>&lt;</option><option>&gt;</option><option>≤</option><option>≥</option></select>'+inp('v','valor'):t==='si'?'<b>x =</b>'+inp('v','x')+'<b>y =</b>'+inp('w','y'):inp('v',t==='po'?'Tu respuesta':'Tu respuesta (ej: 3x + 2)'))+
 `<button class="btn" onclick="submit()">Comprobar</button></div><p class="bad">${esc(T.msg||'')}</p>`}
function render(){const a=$('#app');
 if(S.scr==='welcome')a.innerHTML=`<div class="card"><h1>🧮 ÁlgebraQuest</h1><p class="m">Misiones para repasar Matemáticas Básicas. Un tutor te explica tus errores a tu manera de aprender.</p><input id="nm" placeholder="Tu nombre" value="${esc(S.name)}"><button class="btn" onclick="S.name=$('#nm').value.trim()||'Jugador/a';S.scr='quiz';T.qi=0;T.qs={};render()">Empezar misión</button></div>`;
 else if(S.scr==='quiz'){const q=Q[T.qi];a.innerHTML=`<div class="card"><span class="chip">Cuestionario de estilo ${T.qi+1}/3</span><h2>${q.q}</h2>${q.o.map((x,i)=>`<button class="opt" onclick="ans(${i})">${x[0]}</button>`).join('')}</div>`}
 else if(S.scr==='home')a.innerHTML=`<div class="top"><div><b>Hola, ${esc(S.name)}</b><div class="m">Estilo: ${ST[S.style]}</div></div><div><span class="chip">⭐ ${S.xp}</span><span class="chip">🔥 ${S.streak}</span></div></div><h2>☁️ ¿Qué tema quieres repasar?</h2><p class="m">Si es tu primera vez en un tema, harás 3 ejercicios para ubicar tu nivel.</p><div class="cl">${Object.keys(TP).map(t=>`<button class="cloud" onclick="pickT('${t}')"><span>${TP[t].e}</span>${TP[t].n}<small>${S.t[t]?'Nivel '+LV[S.t[t].unl]:'Empezar'}</small></button>`).join('')}</div><div class="row"><button class="btn sec" onclick="go('stats')">📊 Mi progreso</button><button class="btn sec" onclick="reset()">↺ Reiniciar</button></div>`;
 else if(S.scr==='place')a.innerHTML=`<div class="card"><span class="chip">Ubicación: ${TP[T.tid].n} ${T.pi+1}/3</span>${pc(T.pp[T.pi])}</div>`;
 else if(S.scr==='ready')a.innerHTML=`<div class="card"><h2>¡Listo, ${esc(S.name)}!</h2><p>Tu nivel en <b>${TP[T.tid].n}</b>: <b>${LV[S.t[T.tid].lvl]}</b></p><p class="m">El tutor adaptará sus explicaciones a tu estilo (${ST[S.style]}) cuando te equivoques.</p><button class="btn" onclick="S.scr='play';next()">¡A jugar!</button></div>`;
 else if(S.scr==='stats'){const t=S.ok+S.bad,er=Object.entries(S.err).sort((x,y)=>y[1]-x[1]);
  a.innerHTML=`<div class="card"><h2>📊 Mi progreso</h2><p>Estilo: <b>${ST[S.style]}</b></p><p>⭐ ${S.xp} XP · ✅ ${S.ok} aciertos · ❌ ${S.bad} errores · Precisión: ${t?Math.round(S.ok/t*100):0}%</p><h3>Mis temas</h3>${Object.keys(S.t).map(k=>`<div class="er"><span style="flex:1">${TP[k].e} ${TP[k].n}</span><b>${LV[S.t[k].unl]}</b></div>`).join('')||'<p class="m">Aún no has empezado ningún tema.</p>'}
  <h3>Temas con más errores</h3>${er.length?er.map(([k,n])=>`<div class="er"><span style="width:120px">${TP[k].n}</span><div class="bar"><i style="width:${n/er[0][1]*100}%"></i></div><b>${n}</b></div>`).join(''):'<p class="m">Sin errores registrados todavía.</p>'}
  ${er.length?`<h3>Refuerzo recomendado</h3><p><b>${TP[er[0][0]].n}:</b> ${TP[er[0][0]].tip}</p>`:''}
  <h3>Insignias</h3><p>${S.badges.length?S.badges.map(b=>`<span class="chip">${BG[b]}</span>`).join(' '):'<span class="m">Gana tu primera insignia resolviendo un reto.</span>'}</p><button class="btn" onclick="go('home')">← Volver a los temas</button></div>`}
 else{const P=S.t[T.tid];if(!T.cur)T.cur=pickEx(T.tid);
  a.innerHTML=`<div class="top"><div><b>${TP[T.tid].e} ${TP[T.tid].n}</b><div class="m">${ST[S.style]}</div></div><div><span class="chip">⭐ ${S.xp}</span><span class="chip">🔥 ${S.streak}</span></div></div>
  <div class="lv">${[1,2,3].map(i=>`<button class="lb ${i===P.lvl?'on':''}" ${i>P.unl?'disabled':''} onclick="setLvl(${i})">${i>P.unl?'🔒 ':''}${LV[i]}</button>`).join('')}</div>
  <div class="bar"><i style="width:${Math.min(100,P.per[P.lvl]/4*100)}%"></i></div><p class="m">${Math.min(4,P.per[P.lvl])}/4 aciertos para ${P.lvl<3?'desbloquear el siguiente nivel':'dominar el nivel'}</p>
  ${T.fb&&!T.fb.ok?`<div class="tutor">${T.fb.h}</div>`:''}
  <div class="card">${T.mode==='micro'&&!T.done?'<span class="chip">⚡ Micro reto de refuerzo</span>':''}${T.done?`<div class="eq ${T.cur.q.length>22?'sm':''}">${esc(T.cur.q)}</div><div class="okb">${T.fb.m}<br><small>Respuesta: ${esc(T.cur.ans)}</small></div><button class="btn" onclick="next()">Siguiente reto →</button>`:pc(T.cur)}</div>
  <div class="row"><button class="btn sec" onclick="go('home')">☁️ Temas</button><button class="btn sec" onclick="go('stats')">📊 Mi progreso</button></div>`}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='v'||e.target.id==='w'))submit()});
render();
</script></body></html>
